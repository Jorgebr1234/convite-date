<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quer sair comigo?</title>
    <!-- Biblioteca de Confetes para o 'Sim' -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #ffe5ec, #ffc2d1);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            text-align: center;
            position: relative;
        }

        #card {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(255, 71, 126, 0.15);
            max-width: 380px;
            width: 90%;
            position: relative;
            z-index: 10;
            backdrop-filter: blur(5px);
        }

        h1 {
            color: #ff477e;
            font-size: 1.8rem;
            margin-bottom: 30px;
            line-height: 1.3;
        }

        .botoes {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            min-height: 60px;
            position: relative;
        }

        button {
            padding: 14px 28px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            outline: none;
            user-select: none;
            touch-action: manipulation;
        }

        #btn-sim {
            background-color: #ff477e;
            color: white;
            box-shadow: 0 4px 15px rgba(255, 71, 126, 0.4);
            transition: transform 0.2s, background-color 0.2s;
        }

        #btn-sim:active {
            transform: scale(0.95);
        }

        #btn-nao {
            background-color: #e0e0e0;
            color: #555;
            position: absolute;
            transition: all 0.15s ease-out;
            z-index: 99;
        }

        .sucesso {
            display: none;
            animation: fadeIn 0.5s ease-in-out;
        }

        .sucesso h2 {
            color: #ff477e;
            font-size: 2rem;
            margin-bottom: 15px;
        }

        .sucesso p {
            color: #444;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 10px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div id="card">
        <div id="tela-pergunta">
            <h1>Quer sair comigo para um date? ☕✨</h1>
            <div class="botoes">
                <button id="btn-sim" onclick="aceitou()">Sim!</button>
                <button id="btn-nao">Não</button>
            </div>
        </div>

        <div id="tela-sucesso" class="sucesso">
            <h2>Ebaaa! 🎉❤️</h2>
            <p>Sabia que você ia tomar a decisão certa!</p>
            <p><strong>Te mando os detalhes do lugar e horário agorinha! 🥰</strong></p>
        </div>
    </div>

    <script>
        const btnNao = document.getElementById('btn-nao');

        // Centraliza inicialmente o botão "Não" ao lado do "Sim"
        function posicionarInicial() {
            btnNao.style.position = 'static';
        }
        posicionarInicial();

        function foge(e) {
            if (e) {
                e.preventDefault();
                e.stopPropagation();
            }

            // Garante que o botão use posição fixa na tela inteira
            btnNao.style.position = 'fixed';

            const padding = 20; // Margem para o botão não colar na borda
            const btnWidth = btnNao.offsetWidth;
            const btnHeight = btnNao.offsetHeight;

            // Calcula limites seguros na tela
            const maxX = window.innerWidth - btnWidth - padding;
            const maxY = window.innerHeight - btnHeight - padding;

            const novoX = Math.max(padding, Math.floor(Math.random() * maxX));
            const novoY = Math.max(padding, Math.floor(Math.random() * maxY));

            btnNao.style.left = `${novoX}px`;
            btnNao.style.top = `${novoY}px`;
        }

        // Eventos para Desktop e Mobile (Touch)
        btnNao.addEventListener('touchstart', foge, { passive: false });
        btnNao.addEventListener('mouseover', foge);
        btnNao.addEventListener('click', foge);

        function aceitou() {
            document.getElementById('tela-pergunta').style.display = 'none';
            document.getElementById('tela-sucesso').style.display = 'block';

            // Efeito de confetes
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 100,
                    spread: 70,
                    origin: { y: 0.6 }
                });
            }
        }
    </script>

</body>
</html>
